name: CI/CD Pipeline - Simulador PWR

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: 1) Estilo y tipos (Ruff/Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar herramientas estaticas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff (fallos de estilo / imports muertos)
        run: ruff check src/ tests/

      - name: Mypy (anotaciones de tipos basicas)
        run: PYTHONPATH=. mypy src/ --ignore-missing-imports

  unit-tests:
    name: 2) Tests unitarios (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Dependencias de sistema (SDL2 / pygame)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Instalar Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unitarios (funciones aisladas en tests/unit)
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONPATH: .
        run: |
          mkdir -p logs/simulaciones
          # --cov-fail-under=50: al menos la mitad de lineas de src/ se ejecutan
          # en estos tests; si baja, el CI falla (codigo sin probar de mas).
          python -m pytest tests/unit -q --cov=src --cov-report=term-missing --cov-fail-under=50

  integration-and-validation:
    name: 3) Integracion + validacion completa
    runs-on: ubuntu-latest
    needs: [lint-and-types, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de sistema (SDL2 / pygame)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Instalar Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke PDF + pygame
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONPATH: .
        run: |
          if ls docs/*.pdf >/dev/null 2>&1; then
            python src/scripts/read_pdf_spec.py
          else
            echo "No hay PDF versionado en docs/, se omite lectura automatica"
          fi
          python -c "import pygame; print('pygame-ce', pygame.version.ver)"

      - name: Pytest completo (unit + integration + validation)
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONPATH: .
        run: |
          mkdir -p logs/simulaciones logs/experimentos logs/validacion
          # Incluye tests/validation (SCRAM, Monte Carlo, EXP live, PDF).
          # --cov-fail-under=60: en la suite grande se exige >=60% de lineas
          # de src/ ejecutadas por los tests (ahora suele estar ~70%).
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60 --durations=20

      - name: Runner PDF (run_experiments.py)
        env:
          PYTHONPATH: .
          SDL_VIDEODRIVER: dummy
        run: python src/scripts/run_experiments.py

      - name: Validacion live EXP1-4 (informe + logs academicos)
        env:
          PYTHONPATH: .
          SDL_VIDEODRIVER: dummy
        run: |
          mkdir -p logs/validacion logs/simulaciones
          python -m src.scripts.validate_experiments_report
          test -f logs/validacion/report_experimentos.json
          echo "--- Resumen charts ---"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("logs/validacion/report_experimentos.json").read_text(encoding="utf-8"))
          for idx in (1, 2, 3, 4):
              exp = report["experimentos"][f"exp{idx}"]
              print(f"EXP{idx}: status={exp['status']} result_keys={list((exp.get('result') or {}).keys())}")
          print("charts:", list(report["charts"].keys()))
          PY

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ github.run_id }}
          path: coverage.xml

      - name: Subir logs y experimentos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-validacion-${{ github.run_id }}
          path: |
            logs/
            coverage.xml
