name: CI/CD Pipeline - Simulador PWR

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint + tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar herramientas estaticas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff
        run: ruff check src/ tests/

      - name: Mypy
        run: PYTHONPATH=. mypy src/ --ignore-missing-imports

  unit-tests:
    name: Unit tests (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Dependencias de sistema (SDL2 / pygame)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Instalar Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unitarios
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONPATH: .
        run: |
          mkdir -p logs/simulaciones
          python -m pytest tests/unit -q --cov=src --cov-report=term-missing --cov-fail-under=50

  integration-and-validation:
    name: Integracion + validacion grande
    runs-on: ubuntu-latest
    needs: [lint-and-types, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de sistema (SDL2 / pygame)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Instalar Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PDF + pygame smoke
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONPATH: .
        run: |
          if ls docs/*.pdf >/dev/null 2>&1; then
            python src/scripts/read_pdf_spec.py
          else
            echo "No hay PDF versionado en docs/, se omite lectura automatica"
          fi
          python -c "import pygame; print('pygame-ce', pygame.version.ver)"

      - name: Suite completa (unit + integration + validation)
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONPATH: .
        run: |
          mkdir -p logs/simulaciones logs/experimentos
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70 --durations=20

      - name: Runner de experimentos PDF
        env:
          PYTHONPATH: .
          SDL_VIDEODRIVER: dummy
        run: python src/scripts/run_experiments.py

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ github.run_id }}
          path: coverage.xml

      - name: Subir logs y experimentos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-validacion-${{ github.run_id }}
          path: |
            logs/
            coverage.xml
