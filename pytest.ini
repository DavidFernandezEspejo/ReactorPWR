[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    unit: pruebas unitarias rapidas
    integration: pruebas de integracion entre modulos
    validation: validacion fisica/seguridad de alta cobertura
    slow: pruebas mas pesadas (Monte Carlo / escenarios largos)
filterwarnings =
    ignore::DeprecationWarning
